services:
  api:
    build: .
    ports: ['127.0.0.1:8000:8000']
  prometheus:
    image: prom/prometheus:v3.2.0
    volumes: ['./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:11.5.2
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/churn.json:ro
